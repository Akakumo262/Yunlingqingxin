# 本地依赖（可选）。本机没有 Docker 时后端走内存数据，不影响前端联调。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: yunling          # 属主/迁移账号
      POSTGRES_PASSWORD: yunling
      POSTGRES_DB: yunling
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yunling
      MINIO_ROOT_PASSWORD: yunling-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
